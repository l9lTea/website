<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="search.css" />
  <link rel="stylesheet" href="animations.css" />
  <script src="js/animations.js" defer></script>
  <title>Поиск</title>
</head>
<body>
  <header class="header">
    <div class="header-left">
      <button type="button" class="nav-button" data-link="index.html">Каталог</button>
      <button type="button" class="nav-button" data-link="collection.html">Образы</button>
    </div>
    <div class="header-right">
      <button type="button" class="nav-button" data-link="search.html">Поиск</button>
      <button type="button" class="nav-button" data-link="profile.html">Профиль</button>
      <button type="button" class="nav-button" data-link="cart.html">Корзина</button>
    </div>
  </header>

  <main class="page-content search-page">
    <section class="search-panel">
      <div class="search-title">Поиск</div>
      <div class="search-input-wrapper">
        <input type="text" class="search-input" placeholder="Введите запрос..." />
        <button class="search-button" data-action="perform-search">Найти</button>
      </div>
      <div class="search-results">
        <div class="result-item">
          <div class="result-image"></div>
          <div class="result-info">
            <div class="result-title">Результат 1</div>
            <div class="result-description">Описание товара</div>
          </div>
        </div>
        <div class="result-item">
          <div class="result-image"></div>
          <div class="result-info">
            <div class="result-title">Результат 2</div>
            <div class="result-description">Описание товара</div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="footer-column">
      <h3>Контакты</h3>
      <button class="footer-button" data-action="open-telegram">Telegram</button>
      <button class="footer-button" data-action="open-instagram">Instagram</button>
    </div>
    <div class="footer-column">
      <h3>Адреса</h3>
      <p>Москва</p>
      <p>Санкт-Петербург</p>
      <p>Екатеринбург</p>
    </div>
    <div class="footer-column">
      <h3>Помощь</h3>
    </div>
  </footer>

  <script src="js/script.js"></script>
</body>
</html>
