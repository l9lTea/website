        <div class="profile-field">
          <label>e-mail</label>

        <div class="profile-field">
          <label>Фамилия</label>

        </div>
        <div class="profile-field">
          <label>Имя</label>
          <input type="text" placeholder="Иван" />
        </div>
        <div class="profile-field">
          <label>Дата рождения</label>
          <input type="date" />

        <button class="save-button" data-action="save-profile">Сохранить изменения</button>
