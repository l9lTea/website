      </div>

    <nav class="tabs-wrap" aria-label="Категории одежды">
      <div class="tabs">

      <div class="cat-hero-actions">
        <button type="button" class="ghost-button" data-link="collection.html">Смотреть образы</button>
      </div>
    </section>

    <section class="toolbar">
      <div class="toolbar-left">
        <span class="count-label" data-count></span>
        <div class="chip-row" data-size-filters></div>
      </div>
      <label class="sort-wrap">
        Сортировка
        <select class="sort-select" data-sort>
          <option value="default">по коллекции</option>
          <option value="new">сначала новые</option>
          <option value="price-asc">цена ↑</option>
          <option value="price-desc">цена ↓</option>
